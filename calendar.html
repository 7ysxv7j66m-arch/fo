<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預約行事曆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F3EE;
    --surface: #FDFCF9;
    --green-light: #D4E8D0;
    --green: #6A9E6A;
    --green-dark: #3D6B3D;
    --brown: #7A5230;
    --brown-dark: #4E3218;
    --muted: #9A8E82;
    --border: #E2DDD6;
    --text: #2E2416;
    --booked-bg: #ECEAE6;
    --booked-text: #B0A898;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--brown-dark);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--green-light);
    letter-spacing: 0.08em;
  }
  .logo-sub {
    font-size: 10px;
    font-weight: 300;
    color: rgba(212,232,208,0.55);
    letter-spacing: 0.14em;
    margin-top: 2px;
  }
  .header-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    opacity: 0.7;
  }

  /* ── Main ── */
  .main {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 10px 110px;
  }

  /* ── Month Nav ── */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding: 0 2px;
  }
  .month-title {
    font-size: 17px;
    font-weight: 500;
    color: var(--brown-dark);
    letter-spacing: 0.06em;
  }
  .month-title small {
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
    margin-right: 6px;
  }
  .nav-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 14px;
    transition: all 0.15s;
  }
  .nav-btn:hover { border-color: var(--green); color: var(--green-dark); }

  /* ── Calendar ── */
  .calendar {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 1px 6px rgba(46,36,22,0.06);
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
    padding: 7px 0;
  }
  .weekday {
    text-align: center;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .weekday.sat { color: var(--green-dark); }
  .weekday.sun { color: var(--brown); }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    min-height: 96px;
    padding: 7px 6px 7px;
    position: relative;
  }
  /* 移除最右欄右邊框 */
  .day-cell:nth-child(7n) { border-right: none; }

  .day-cell.empty   { background: var(--bg); }
  .day-cell.past    { background: var(--bg); }
  .day-cell.no-slot { background: var(--bg); }
  .day-cell.has-slot { background: var(--surface); }
  .day-cell.today   { background: #F0F7EE; }

  .day-num {
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    margin-bottom: 6px;
    color: var(--text);
  }
  .day-cell.past .day-num    { color: var(--border); }
  .day-cell.empty .day-num   { color: transparent; }
  .day-cell.no-slot .day-num { color: #C8C0B6; }
  .day-cell.today .day-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px; height: 20px;
    background: var(--brown);
    color: white;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 500;
  }

  /* 時段標籤 */
  .slot-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .slot-tag {
    font-size: 10.5px;
    font-weight: 400;
    color: var(--green-dark);
    background: var(--green-light);
    border-radius: 4px;
    padding: 3px 4px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot-tag.booked {
    color: var(--booked-text);
    background: var(--booked-bg);
    text-decoration: line-through;
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 0;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }
  .legend-swatch {
    width: 20px; height: 10px;
    border-radius: 2px;
  }
  .legend-swatch.available { background: var(--green-light); }
  .legend-swatch.booked    { background: var(--booked-bg); }

  /* ── CTA ── */
  .cta-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 10px 14px 26px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    pointer-events: none;
  }
  .cta-box {
    max-width: 680px;
    margin: 0 auto;
    background: var(--brown-dark);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 4px 18px rgba(46,36,22,0.2);
    pointer-events: all;
  }
  .cta-text { color: white; }
  .cta-text p {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 2px;
    font-weight: 300;
  }
  .cta-text strong {
    font-size: 13px;
    font-weight: 500;
    color: var(--green-light);
  }
  .cta-btn {
    background: var(--green-light);
    color: var(--brown-dark);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .cta-btn:hover { background: #C2DFC0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="logo-text">BLOSSOM STUDIO</div>
      <div class="logo-sub">美體工作室</div>
    </div>
    <div class="header-dot"></div>
  </div>
</div>

<div class="main">
  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div class="weekday">一</div>
      <div class="weekday">二</div>
      <div class="weekday">三</div>
      <div class="weekday">四</div>
      <div class="weekday">五</div>
      <div class="weekday sat">六</div>
      <div class="weekday sun">日</div>
    </div>
    <div class="days" id="daysGrid"></div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch available"></div>可預約
    </div>
    <div class="legend-item">
      <div class="legend-swatch booked"></div>已預約
    </div>
  </div>
</div>

<div class="cta-wrap">
  <div class="cta-box">
    <div class="cta-text">
      <p>看到喜歡的時段？</p>
      <strong>傳訊息給我們預約 💬</strong>
    </div>
    <button class="cta-btn">LINE 聯絡</button>
  </div>
</div>

<script>
  const MONTHS_ZH = ['一月','二月','三月','四月','五月','六月',
                     '七月','八月','九月','十月','十一月','十二月'];

  function mondayFirst(dow) { return (dow + 6) % 7; }
  function pad(n) { return String(n).padStart(2,'0'); }

  const mockSlots = {
    '2026-05-01': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-04': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:false },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-05': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
    ],
    '2026-05-06': [
      { start:'9:00',  end:'10:30', available:false },
      { start:'14:00', end:'15:30', available:true  },
    ],
    '2026-05-07': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-11': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-12': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:false },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-13': [
      { start:'10:00', end:'11:30', available:true  },
      { start:'15:00', end:'16:30', available:true  },
    ],
    '2026-05-14': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-18': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:false },
    ],
    '2026-05-19': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-20': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-21': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
    ],
    '2026-05-22': [
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-25': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-26': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:false },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-27': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
    ],
    '2026-05-28': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'13:00', end:'14:30', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
    '2026-05-29': [
      { start:'9:00',  end:'10:00', available:true  },
      { start:'17:00', end:'18:30', available:true  },
    ],
  };

  // 休假日：不顯示任何內容，空格就好
  const restDays = new Set(['2026-05-02','2026-05-09','2026-05-16','2026-05-23','2026-05-30']);

  let year = 2026, month = 4;

  function changeMonth(dir) {
    month += dir;
    if (month > 11) { month = 0; year++; }
    if (month < 0)  { month = 11; year--; }
    render();
  }

  function render() {
    document.getElementById('monthTitle').innerHTML =
      `<small>${year}</small>${MONTHS_ZH[month]}`;
    renderCalendar();
  }

  function renderCalendar() {
    const firstDay    = new Date(year, month, 1).getDay();
    const offset      = mondayFirst(firstDay);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today       = new Date();
    const todayStr    = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    const grid        = document.getElementById('daysGrid');
    grid.innerHTML    = '';

    // 空格
    for (let i = 0; i < offset; i++) {
      const el = document.createElement('div');
      el.className = 'day-cell empty';
      el.innerHTML = '<div class="day-num"></div>';
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const ds      = `${year}-${pad(month+1)}-${pad(d)}`;
      const isToday = ds === todayStr;
      const isPast  = ds < todayStr;
      const isRest  = restDays.has(ds);
      const slots   = (!isRest && !isPast) ? (mockSlots[ds] || []) : [];
      const hasSlot = slots.some(s => s.available);

      let cls = 'day-cell';
      if (isPast || isRest)  cls += ' no-slot';
      else if (isToday)      cls += ' today';
      else if (hasSlot)      cls += ' has-slot';
      else                   cls += ' no-slot';

      const numHtml = `<div class="day-num">${d}</div>`;

      const slotsHtml = slots.length
        ? `<div class="slot-list">` +
          slots.map(s =>
            `<div class="slot-tag ${s.available ? '' : 'booked'}">${s.start}–${s.end}</div>`
          ).join('') +
          `</div>`
        : '';

      const el = document.createElement('div');
      el.className = cls;
      el.innerHTML = numHtml + slotsHtml;
      grid.appendChild(el);
    }
  }

  render();
</script>
</body>
</html>
